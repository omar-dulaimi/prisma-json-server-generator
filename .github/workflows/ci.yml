name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, generate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # No lint script and no linter installed, so nothing here invents one. tsc, vitest and
      # gen-example are what the repo actually defines.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build, then run the generator against the example schema
        run: npm run gen-example

      - name: Assert the generator actually emitted usable data
        # `prisma generate` exits 0 even when a generator writes nothing, and this generator's
        # entire output is one file, so check its content rather than trusting the exit code.
        run: |
          set -euo pipefail
          test -f prisma/generated/db.json
          node -e '
            const db = require("./prisma/generated/db.json");
            const keys = Object.keys(db);
            if (!keys.includes("users") || !keys.includes("posts")) {
              throw new Error("expected users and posts collections, got: " + keys.join(", "));
            }
            for (const k of ["users", "posts"]) {
              if (!Array.isArray(db[k]) || db[k].length === 0) throw new Error(k + " is empty");
              if (db[k][0].id === undefined) throw new Error(k + "[0] has no id, json-server needs one");
            }
            console.log("db.json ok:", keys.map((k) => k + "=" + db[k].length).join(" "));
          '

  # Verifies the artefact users actually get, which is not the working tree. This repo publishes a
  # curated directory assembled by package.sh, so a green working tree tells you nothing about
  # whether the tarball contains lib/, whether `bin` resolves after a real install, or whether it
  # runs on a supported Node. A sibling repo shipped a `files` rule that omitted a required JSON
  # file and broke every consumer for four years with fully green CI. So this job packs, installs
  # into an empty project, and runs the command the README leads with.
  #
  # Both Prisma majors are exercised, because the whole point of the current fix was that this
  # generator re-parsed the schema through a bundled @prisma/internals and was therefore dead on
  # Prisma 7. A single-major matrix would let that regress unnoticed.
  packaged-artifact:
    name: Packaged artifact (Node ${{ matrix.node-version }}, Prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
        prisma: ['6', '7']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build the publishable package directory
        # The same script the release job runs, so CI exercises the real packaging path.
        run: npm run package

      - name: Assert the package directory is not empty
        # package.sh removes lib/ and package/ before rebuilding them. It used to do that without
        # `set -e` and with a bare `tsc`, so when tsc was not on PATH it produced an EMPTY package
        # and still exited 0. That is fixed, and this asserts it stays fixed.
        run: |
          set -euo pipefail
          test -f package/package.json
          test -d package/lib
          test -f package/lib/generator.js
          test -d package/lib/lowdb
          echo "package/ contains $(find package -type f | wc -l) files"

      - name: Pack the tarball that would be published
        working-directory: package
        # --pack-destination keeps the tarball out of package/, so it cannot end up inside a later
        # publish of that same directory.
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an empty consumer project
        # An empty directory, not the repo: installing into the repo would let the working tree's
        # own node_modules mask a broken package.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer/prisma"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          # Prisma 7 removed `url` from datasource blocks, so the URL goes in prisma.config.ts
          # there and stays inline on 6. Written per-major rather than picking one that only
          # works on half the matrix.
          if [ "${{ matrix.prisma }}" = "7" ]; then
            datasource='datasource db {
            provider = "sqlite"
          }'
            cat > prisma.config.ts <<'CONFIG'
          import path from 'node:path';
          export default {
            schema: path.join('prisma', 'schema.prisma'),
          };
          CONFIG
          else
            datasource='datasource db {
            provider = "sqlite"
            url      = "file:./dev.db"
          }'
          fi
          cat > prisma/schema.prisma <<SCHEMA
          generator json_server {
            provider = "prisma-json-server-generator"
          }

          $datasource

          model User {
            id    Int     @id @default(autoincrement())
            email String  @unique
            name  String?
            posts Post[]
          }

          model Post {
            id        Int      @id @default(autoincrement())
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
            title     String
            content   String?
            published Boolean  @default(false)
            viewCount Int      @default(0)
            author    User?    @relation(fields: [authorId], references: [id])
            authorId  Int?
          }
          SCHEMA
          echo "--- schema.prisma ---"
          cat prisma/schema.prisma

      - name: Install the packed tarball
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/prisma-json-server-generator-*.tgz)"
          echo "installing $tarball against prisma ${{ matrix.prisma }}"
          npm install --no-audit --no-fund "$tarball" \
            "prisma@${{ matrix.prisma }}" "@prisma/client@${{ matrix.prisma }}"

      - name: Run the README's headline command against the installed package
        working-directory: ${{ runner.temp }}/consumer
        # This only passes if the tarball contained lib/, if bin resolved after a real install,
        # and if the generator runs on this Node and this Prisma major.
        run: npx prisma generate

      - name: Assert the installed package emitted usable data
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          test -f prisma/generated/db.json
          node -e '
            const db = require("./prisma/generated/db.json");
            const keys = Object.keys(db);
            if (!keys.includes("users") || !keys.includes("posts")) {
              throw new Error("expected users and posts collections, got: " + keys.join(", "));
            }
            for (const k of ["users", "posts"]) {
              if (!Array.isArray(db[k]) || db[k].length === 0) throw new Error(k + " is empty");
              if (db[k][0].id === undefined) throw new Error(k + "[0] has no id, json-server needs one");
            }
            console.log("db.json ok:", keys.map((k) => k + "=" + db[k].length).join(" "));
          '

      - name: Install json-server
        working-directory: ${{ runner.temp }}/consumer
        # Installed as its own step rather than via `npx --yes` at run time. Downloading it inside
        # the serve step spent the readiness budget on the download, so the wait expired before the
        # server ever started.
        run: npm install --no-audit --no-fund --no-save json-server@0.17.4

      - name: Assert json-server can actually serve it
        working-directory: ${{ runner.temp }}/consumer
        # The README's promise is "a full CRUD REST API in two commands", and the second command is
        # json-server. Emitting a plausible-looking file is not the same as emitting one json-server
        # accepts, so serve it and make a real request.
        run: |
          set -euo pipefail
          ./node_modules/.bin/json-server --watch prisma/generated/db.json --port 3123 > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3123/users > /dev/null 2>&1; then ready=1; break; fi
            # Fail fast and loudly if the server died, instead of waiting out the whole budget.
            if ! kill -0 "$server" 2>/dev/null; then
              echo "::error::json-server exited before becoming ready"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          # Without this the loop could expire silently and the request below would parse an empty
          # body, reporting a confusing JSON error instead of "the server never came up".
          if [ -z "$ready" ]; then
            echo "::error::json-server did not answer on port 3123 within 60s"
            cat server.log
            exit 1
          fi

          curl -sf http://127.0.0.1:3123/users > users.json
          node -e '
            const users = require("./users.json");
            if (!Array.isArray(users) || users.length === 0) throw new Error("GET /users returned nothing");
            if (users[0].id === undefined) throw new Error("served users have no id");
            console.log("json-server served " + users.length + " users, first id " + users[0].id);
          '
